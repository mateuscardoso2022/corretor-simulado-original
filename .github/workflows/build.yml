name: Build APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
timeout-minutes: 60

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git \
        zip \
        unzip \
        openjdk-17-jdk \
        autoconf \
        libtool \
        pkg-config \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev \
        cmake \
        libffi-dev \
        libssl-dev \
        automake \
        libsqlite3-dev \
        libbz2-dev \
        libreadline-dev \
        libgdbm-dev \
        liblzma-dev \
        tk-dev

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip
      python -m pip install buildozer cython

  - name: Create buildozer.spec
    run: |
      cat > buildozer.spec <<'EOF'
      [app]

      title = Corretor de Simulado
      package.name = corretorsimulado
      package.domain = br.com.corretorsimulado

      source.dir = .
      source.include_exts = py,png,jpg,jpeg,kv,json,txt

      version = 1.0.0

      requirements = python3,kivy==2.3.0,numpy,opencv,pillow,plyer

      orientation = portrait
      fullscreen = 0

      android.permissions = CAMERA
      android.api = 33
      android.minapi = 24
      android.ndk = 25b

      android.archs = arm64-v8a

      android.package_format = apk

      [buildozer]

      log_level = 2
      warn_on_root = 1
      EOF

  - name: Build APK
    run: |
      buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: corretor-simulado-apk
      path: bin/*.apk
      retention-days: 30

  - name: Upload build logs if failed
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: build-logs
      path: .buildozer/
      retention-days: 7
```
